; Arduino core 3.x is required (Audio.cpp checks ESP_ARDUINO_VERSION_MAJOR), which
; the stock espressif32 platform does not ship, hence the pioarduino fork.
[platformio]
src_dir = sketch

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
lib_deps = ESP32-audioI2S=symlink:///repo
lib_ldf_mode = deep
monitor_speed = 115200
board_build.partitions = huge_app.csv
; CORE_DEBUG_LEVEL is set by the Arduino IDE, which Audio.h relies on.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

[env:esp32p4]
board = esp32-p4-evboard

; Only partly supported by the library (see README); kept for size comparison.
[env:esp32]
board = esp32dev

; The same targets with libfaad3 as the AAC decoder, for size comparison.
[env:esp32s3_faad3]
extends = env:esp32s3
build_flags = ${env.build_flags} -DAAC_USE_FAAD3

[env:esp32p4_faad3]
extends = env:esp32p4
build_flags = ${env.build_flags} -DAAC_USE_FAAD3

[env:esp32_faad3]
extends = env:esp32
build_flags = ${env.build_flags} -DAAC_USE_FAAD3
